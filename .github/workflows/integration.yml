name: MewUI Designer integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  NuGetPackageSourceCredentials_lextudio_github: Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }};ValidAuthenticationTypes=Basic

jobs:
  resolve-version:
    name: Resolve latest stable OpenDevelop
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - name: Query latest release
        id: resolve
        shell: bash
        run: |
          set -e
          tag=$(curl -fsSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/lextudio/OpenDevelop/releases/latest \
            | python3 -c 'import sys,json; print(json.load(sys.stdin)["tag_name"])')
          echo "Latest stable OpenDevelop: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build-addin:
    name: Build add-in (AnyCPU)
    needs: resolve-version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: MewUI-Designer
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: lextudio/OpenDevelop
          ref: ${{ needs.resolve-version.outputs.tag }}
          path: OpenDevelop
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '11.0.x'
      - name: Build
        shell: bash
        run: |
          set -e
          export MROOT="${{ github.workspace }}/MewUI-Designer"
          export OROOT="${{ github.workspace }}/OpenDevelop"
          CFG="$MROOT/.github/ci/NuGet.Config"
          cd "$MROOT"
          dotnet restore src/OpenDevelop.AddIn/MewUIDesigner/MewUIDesigner.csproj --configfile "$CFG"
          dotnet build src/OpenDevelop.AddIn/MewUIDesigner/MewUIDesigner.csproj -c Debug --no-restore -p:OpenDevelopRoot="$OROOT/" -p:EnableWindowsTargeting=true
      - name: Upload add-in
        uses: actions/upload-artifact@v4
        with:
          name: mewui-addin
          path: OpenDevelop/AddIns/DisplayBindings/MewUIDesigner/**
          if-no-files-found: error

  integration:
    name: DevFlow integration (${{ matrix.name }})
    needs: [resolve-version, build-addin]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows-x64,   os: windows-latest,   asset: OpenDevelop-win.7z }
          - { name: windows-arm64, os: windows-11-arm,   asset: OpenDevelop-win.7z }
          - { name: linux-x64,     os: ubuntu-latest,    asset: OpenDevelop-linux-x64.tar.xz }
          - { name: linux-arm64,   os: ubuntu-26.04-arm, asset: OpenDevelop-linux-arm64.tar.xz }
          - { name: macos-arm64,   os: macos-latest,     asset: OpenDevelop-macos.dmg }
    steps:
      - uses: actions/checkout@v4
        with:
          path: MewUI-Designer
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: lextudio/OpenDevelop
          ref: ${{ needs.resolve-version.outputs.tag }}
          path: OpenDevelop
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          # 11 builds the test project; 10 is the runtime OpenDevelop and the net10.0 test host run on.
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Download plugin
        uses: actions/download-artifact@v4
        with:
          name: mewui-addin
          path: ${{ runner.temp }}/addin

      - name: Install Linux display dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Reuse OpenDevelop's own definition of the Linux environment (Xvfb plus the Vulkan loader and
          # Mesa's lavapipe software driver: the hosted runners have no GPU, and without it wgpu has no
          # instance and the IDE aborts with SIGABRT/134 at startup).
          bash "${{ github.workspace }}/OpenDevelop/.github/ci/install-linux-prerequisites.sh" --display

      - name: Download stable OpenDevelop
        shell: bash
        env:
          TAG: ${{ needs.resolve-version.outputs.tag }}
          ASSET: ${{ matrix.asset }}
        run: |
          set -e
          mkdir -p "${{ runner.temp }}/od"
          curl -fL -o "${{ runner.temp }}/od/pkg" \
            "https://github.com/lextudio/OpenDevelop/releases/download/${TAG}/${ASSET}"
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            hdiutil attach "${{ runner.temp }}/od/pkg" -nobrowse -mountpoint "${{ runner.temp }}/od/mnt"
            cp -R "${{ runner.temp }}/od/mnt/OpenDevelop.app" "${{ runner.temp }}/od/OpenDevelop.app"
            hdiutil detach "${{ runner.temp }}/od/mnt"
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            7z x "${{ runner.temp }}/od/pkg" -o"${{ runner.temp }}/od" -y
          else
            mkdir -p "${{ runner.temp }}/od/linux"
            tar -xJf "${{ runner.temp }}/od/pkg" -C "${{ runner.temp }}/od/linux"
          fi

      - name: Set OpenDevelop app path
        shell: bash
        run: |
          set -e
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            app="${{ runner.temp }}/od/OpenDevelop.app/Contents/MacOS/OpenDevelop"
          elif [[ "${{ runner.os }}" == "Windows" ]]; then
            # One unified payload ships both launchers: OpenDevelop.exe is x64, OpenDevelopARM64.exe is ARM64.
            launcher="OpenDevelop.exe"
            [[ "${{ matrix.name }}" == "windows-arm64" ]] && launcher="OpenDevelopARM64.exe"
            app=$(find "${{ runner.temp }}/od" -name "$launcher" | head -1)
          else
            app=$(find "${{ runner.temp }}/od/linux" -maxdepth 3 -type f -name "OpenDevelop" -perm -u+x | head -1)
          fi
          echo "OPENDEVELOP_APP_PATH=$app" >> "$GITHUB_ENV"

      - name: Build integration tests
        shell: bash
        run: |
          set -e
          export MROOT="${{ github.workspace }}/MewUI-Designer"
          export OROOT="${{ github.workspace }}/OpenDevelop"
          CFG="$MROOT/.github/ci/NuGet.Config"
          cd "$MROOT"
          dotnet restore src/OpenDevelop.AddIn/MewUIDesigner.IntegrationTests/MewUIDesigner.IntegrationTests.csproj --configfile "$CFG"
          dotnet build src/OpenDevelop.AddIn/MewUIDesigner.IntegrationTests/MewUIDesigner.IntegrationTests.csproj -c Debug --no-restore -p:OpenDevelopRoot="$OROOT/" -p:EnableWindowsTargeting=true

      - name: Install plugin into stable OpenDevelop
        shell: bash
        run: |
          set -e
          if [[ "${{ runner.os }}" == "macOS" ]]; then
            ADDINS="${{ runner.temp }}/od/OpenDevelop.app/Contents/MacOS/AddIns"
          else
            ADDINS="$(dirname "$OPENDEVELOP_APP_PATH")/AddIns"
          fi
          rm -rf "$ADDINS/DisplayBindings/MewUIDesigner"
          mkdir -p "$ADDINS/DisplayBindings/MewUIDesigner"
          cp -R "${{ runner.temp }}/addin/"* "$ADDINS/DisplayBindings/MewUIDesigner/"

      - name: Run integration tests
        shell: bash
        run: |
          set -e
          export MROOT="${{ github.workspace }}/MewUI-Designer"
          export OROOT="${{ github.workspace }}/OpenDevelop"
          cd "$MROOT/src/OpenDevelop.AddIn/MewUIDesigner.IntegrationTests"
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            xvfb-run --auto-servernum dotnet run -c Debug --no-build -p:OpenDevelopRoot="$OROOT/" -- \
              -class OpenDevelop.IntegrationTests.MewUIDesignerTests -parallel none
          else
            dotnet run -c Debug --no-build -p:OpenDevelopRoot="$OROOT/" -- \
              -class OpenDevelop.IntegrationTests.MewUIDesignerTests -parallel none
          fi
